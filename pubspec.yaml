name: medideliver
description: "A quick commerce platform for pharmaceutical delivery."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ───────────────────────────────
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  hooks_riverpod: ^3.3.2
  flutter_hooks: ^0.21.3+1

  # ── Navigation ─────────────────────────────────────
  go_router: ^17.3.0

  # ── Data Modeling & Serialization ──────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # ── Functional Error Handling ──────────────────────
  fpdart: ^1.1.0

  # ── Network ────────────────────────────────────────
  dio: ^5.8.0
  pretty_dio_logger: ^1.3.1

  # ── Secure Storage ─────────────────────────────────
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3

  # ── Firebase (Push Notifications only) ────────────
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0

  # ── Maps & Location ────────────────────────────────
  google_maps_flutter: ^2.10.0
  geolocator: ^14.0.3
  geocoding: ^4.0.0

  # ── Image Handling ─────────────────────────────────
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # ── Payment ────────────────────────────────────────
  razorpay_flutter: ^1.3.7

  # ── UI Utilities ───────────────────────────────────
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_svg: ^2.0.17
  pinput: ^6.0.2

  # ── General Utilities ──────────────────────────────
  intl: ^0.20.2
  url_launcher: ^6.3.1
  permission_handler: ^12.0.3
  connectivity_plus: ^7.1.1
  package_info_plus: ^10.1.0
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generators ────────────────────────────────
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.4   # pinned to 2.6.4 — 2.6.5+ requires freezed_annotation ^3.x
  freezed: ^3.0.0
  json_serializable: ^6.9.5

  # ── Linting ────────────────────────────────────────
  flutter_lints: ^6.0.0

  # ── Testing ────────────────────────────────────────
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # assets:
    # - assets/images/
    # - assets/icons/
    # - assets/animations/