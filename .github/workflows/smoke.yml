name: Deployed COD browser checks
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/smoke_web.mjs
      - .github/workflows/smoke.yml
permissions:
  contents: read
jobs:
  deployed-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke_web.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-browser-screenshots
          path: smoke-results
